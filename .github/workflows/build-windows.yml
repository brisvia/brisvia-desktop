name: Build Windows

# Builds the whole app for Windows (x64) on GitHub's free Windows runners:
# RandomX -> bitcoind node (MSVC + vcpkg, wallet only) -> Rust miner -> Tauri app (NSIS installer)
# -> attach the signed installer to the release. Triggered manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4

      # Version guard (real bug: tauri.conf said 1.0.2 and Cargo.toml 1.0.0 -> the app showed the old one).
      # If they do not match, the build FAILS here and nothing out of sync gets published.
      - name: Guard - tauri.conf.json and Cargo.toml versions must match
        shell: bash
        env:
          GITHUB_WORKFLOW_FILE: .github/workflows/build-windows.yml
        run: |
          TC=$(grep -oE '"version": "[0-9]+\.[0-9]+\.[0-9]+"' src-tauri/tauri.conf.json | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CG=$(grep -oE '^version = "[0-9]+\.[0-9]+\.[0-9]+"' src-tauri/Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          # The tag the release attaches to has to be the SAME number: otherwise the updater
          # offers people a version that does not match the one the installer carries.
          TAG=$(grep -oE 'tag_name: v[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_WORKFLOW_FILE" | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "tauri.conf.json = $TC | Cargo.toml = $CG | release tag = $TAG"
          if [ "$TC" != "$CG" ]; then echo "FAIL: versions out of sync ($TC vs $CG)"; exit 1; fi
          if [ "$TAG" != "$TC" ]; then echo "FAIL: the release tag (v$TAG) does not match the version ($TC)"; exit 1; fi
          echo "OK: version and tag in sync ($TC)"

      # PRODUCT guards (not logic). They exist because of real bugs the owner found in 2 minutes and
      # a 20-agent audit missed: a Spanish text with the language set to English, and a raw node error
      # on screen. They look at the product as people see it, not at the code in isolation.
      - name: Guard - texts (complete languages, no mixes, no hardcoded text in the HTML)
        shell: bash
        run: python tools/check_textos.py

      - name: Guard - errors (every program error arrives translated in ES and EN)
        shell: bash
        run: python tools/check_error_contract.py

      - name: Checkout core (with the RandomX submodule)
        uses: actions/checkout@v4
        with:
          repository: brisvia/brisvia
          # Pin the node source to the commit with the mainnet port move (P2P 9342, RPC 9338). Core `main` still
          # has Litecoin's old 9333/9332; the fix lives on mainnet-ports-9342 (one commit ahead, same genesis).
          # Without this pin the packaged node shipped on 9333. TODO: merge that branch into main, then drop the pin.
          ref: 8195a1b0c71d236eb32b8675ffc245e1f6f7fcb1
          submodules: recursive
          path: core

      - name: Build RandomX (static lib, portable)
        shell: pwsh
        run: |
          # Static MSVC runtime (MultiThreaded) to match the vs2022-static preset; otherwise the
          # final link fails with LNK1169 (multiply defined symbols from libucrt).
          cmake -S core/src/randomx -B core/src/randomx/build -DCMAKE_BUILD_TYPE=Release -DARCH=default `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build core/src/randomx/build --config Release -j
          $rx = Get-ChildItem -Path core/src/randomx/build -Recurse -Filter randomx.lib | Select-Object -First 1
          echo "RANDOMX_LIB=$($rx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Mark job start (used to prove the sidecar was built by THIS run)
        shell: pwsh
        run: |
          $t = (Get-Date).ToUniversalTime().ToString("o")
          "JOB_START_UTC=$t" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "job start (UTC): $t"

      - name: Configure and build bitcoind + bitcoin-cli (MSVC + vcpkg, wallet only)
        shell: pwsh
        working-directory: core
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT   # GitHub Windows runners ship vcpkg here
          cmake --preset vs2022-static -B build `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON -DVCPKG_MANIFEST_FEATURES=wallet `
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DWITH_ZMQ=OFF -DENABLE_IPC=OFF `
            -DBRISVIA_RANDOMX_LIB="$env:RANDOMX_LIB" `
            -DBRISVIA_RANDOMX_INCLUDE="$PWD/src/randomx/src"
          cmake --build build --config Release --target bitcoind bitcoin-cli -j

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the miner (mine-once)
        shell: pwsh
        run: |
          $env:RANDOMX_LIB_DIR = (Split-Path $env:RANDOMX_LIB)
          cargo build --release --manifest-path crates/brisvia-randomx/Cargo.toml --bin mine-once

      - name: Stage binaries (.exe)
        shell: pwsh
        run: |
          # PROVENANCE GUARD. This step used to do `Get-ChildItem -Recurse | Select-Object -First 1`: it
          # picked a bitcoind by NAME and took whatever came first. With zero matches $bd was $null and any
          # bitcoind already sitting in src-tauri/binaries would have shipped instead; with two matches it
          # picked one non-deterministically. A stale node is not a loud failure — it is a DIFFERENT NETWORK
          # that only reveals itself on launch day. (Real case, 2026-07-15: a 9-July bitcoind.exe carrying
          # the pre-recalibration genesis 7f1cf9cf was found in a working tree.)
          # Rules: the binary must be UNIQUE, must have been produced by THIS run, and its hash is recorded
          # so the packaged copy can be compared against it later.
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Remove-Item src-tauri/binaries/* -Force -ErrorAction SilentlyContinue  # nothing pre-existing survives

          function Take-One($path, $filter, $extra) {
            $all = @(Get-ChildItem -Path $path -Recurse -Filter $filter -ErrorAction SilentlyContinue)
            if ($extra) { $all = @($all | Where-Object $extra) }
            if ($all.Count -eq 0) { throw "FAIL: no $filter was compiled in this job. A pre-existing binary is NOT packaged." }
            if ($all.Count -gt 1) { throw "FAIL: there are $($all.Count) copies of $filter and I cannot tell which is this build's: $($all.FullName -join ', ')" }
            if ($all[0].LastWriteTimeUtc -lt [datetime]::Parse($env:JOB_START_UTC)) {
              throw "FAIL: $filter is older than the job start ($($all[0].LastWriteTimeUtc) < $env:JOB_START_UTC): this build did not produce it."
            }
            return $all[0]
          }

          $bd  = Take-One "core/build" "bitcoind.exe" $null
          $cli = Take-One "core/build" "bitcoin-cli.exe" $null
          $mw  = Take-One "." "mine-once.exe" { $_.FullName -match 'release' }
          Copy-Item $bd.FullName  src-tauri/binaries/bitcoind.exe
          Copy-Item $cli.FullName src-tauri/binaries/bitcoin-cli.exe
          Copy-Item $mw.FullName  src-tauri/binaries/brisvia-worker.exe

          # Log the UNSIGNED hash for traceability only. The CANONICAL hash the packaged-node guard compares
          # against is recorded AFTER Authenticode signing (the sidecars are signed before Tauri bundles them,
          # which changes their bytes) — see the "Sign the sidecars" step below. Fixing the identity at the
          # SIGNED bytes keeps the same guarantee ("the shipped node is exactly what this job produced") while
          # letting Defender/SmartScreen see a signed node and worker.
          $h = (Get-FileHash src-tauri/binaries/bitcoind.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "sidecar bitcoind.exe SHA-256 (UNSIGNED, pre-signing, for traceability): $h"
          Get-ChildItem src-tauri/binaries

      # After staging the sidecar binaries, so the Tauri build script finds the resources it validates.
      - name: Rust tests on this platform (golden vector + wallet battery + crate) - MAINNET
        shell: pwsh
        env:
          BRISVIA_WALLET_CASES: "5000"
        run: |
          $env:RANDOMX_LIB_DIR = (Split-Path $env:RANDOMX_LIB)
          cargo test --manifest-path crates/brisvia-randomx/Cargo.toml -- --skip vector_fast
          cargo test --manifest-path src-tauri/Cargo.toml --features mainnet --lib wallet_key_tests -- --nocapture

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Set up CodeSignTool (SSL.com eSigner) and validate credentials
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          # Pinned version of SSL.com's CodeSignTool (bundles its own Java). The wrapper invokes it per file.
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/cst.zip"
          Expand-Archive "$env:RUNNER_TEMP/cst.zip" -DestinationPath "$env:RUNNER_TEMP/codesigntool" -Force
          $bat = Get-ChildItem "$env:RUNNER_TEMP/codesigntool" -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          if (-not $bat) { throw "CodeSignTool.bat not found after extracting the zip" }
          $cstHome = $bat.Directory.FullName
          # CodeSignTool.bat resolves its bundled Java and jar RELATIVE to the current directory unless
          # CODE_SIGN_TOOL_PATH is set. Invoking it by absolute path from another folder makes it look for
          # .\jdk-11.0.2\bin\java in the wrong place and fail with "The system cannot find the path specified".
          # Setting CODE_SIGN_TOOL_PATH makes the .bat use absolute paths. We export two names to later steps:
          # CODESIGNTOOL_HOME is what the sign wrapper uses to locate the .bat; CODE_SIGN_TOOL_PATH is what the
          # .bat itself reads to find its own Java and jar.
          $env:CODE_SIGN_TOOL_PATH = $cstHome
          "CODESIGNTOOL_HOME=$cstHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CODE_SIGN_TOOL_PATH=$cstHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CODESIGNTOOL_HOME=$cstHome"
          # Validate the credentials WITHOUT building the release (credential_info needs no TOTP). Fail loud if wrong.
          & "$cstHome/CodeSignTool.bat" credential_info -username="$env:ES_USERNAME" -password="$env:ES_PASSWORD" -credential_id="$env:ES_CREDENTIAL_ID"
          if ($LASTEXITCODE -ne 0) { throw "eSigner credential_info failed — check the ES_* secrets" }
          # CRITICAL: Tauri's signCommand spawns the wrapper WITHOUT this step's `env:` vars — only job-level
          # env (GITHUB_ENV) reaches it. That is why CODESIGNTOOL_HOME arrived at the wrapper but the ES_* did
          # NOT, so the wrapper aborted with "env ES_USERNAME is not set" — which Tauri surfaces only as its
          # opaque "failed to run powershell". Promote the eSigner credentials to job-level env so the wrapper
          # Tauri spawns can read them. GitHub keeps masking these values in logs (they come from secrets).
          "ES_USERNAME=$env:ES_USERNAME"           | Out-File -FilePath $env:GITHUB_ENV -Append
          "ES_PASSWORD=$env:ES_PASSWORD"           | Out-File -FilePath $env:GITHUB_ENV -Append
          "ES_CREDENTIAL_ID=$env:ES_CREDENTIAL_ID" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ES_TOTP_SECRET=$env:ES_TOTP_SECRET"     | Out-File -FilePath $env:GITHUB_ENV -Append

      # #9 fix: Authenticode-sign the three sidecars (node, worker, cli) BEFORE Tauri bundles them. Windows
      # Defender/SmartScreen scan child processes on their own: an unsigned bitcoind.exe or brisvia-worker.exe
      # can be quarantined even when launched by the signed app, leaving the app open but unable to mine. We
      # sign here, VERIFY each signature, and record the SIGNED hashes — those become the canonical values the
      # packaged-node guard checks, so "shipped == built" holds on the signed bytes (the identity is simply
      # fixed at the signed bytes instead of the unsigned ones). The sign-wrapper then SKIPS these already-signed
      # sidecars during the Tauri build so they are never double-signed.
      - name: Sign the sidecars (Authenticode via eSigner) before bundling
        shell: pwsh
        env:
          EXPECT_THUMBPRINT: ${{ secrets.ES_CERT_THUMBPRINT }}
          EXPECT_SERIAL: ${{ secrets.ES_CERT_SERIAL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CODE_SIGN_TOOL_PATH = $env:CODESIGNTOOL_HOME
          $tool = Join-Path $env:CODESIGNTOOL_HOME 'CodeSignTool.bat'
          if (-not (Test-Path $tool)) { throw "sign-sidecars: CodeSignTool.bat not found at $tool" }

          function Sign-InPlace($path) {
            $name = Split-Path $path -Leaf
            $outDir = Join-Path $env:RUNNER_TEMP ("signsc_" + [System.Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            # Sign into a fresh dir so the original is never half-overwritten on failure; args are not echoed.
            $o = & $tool sign -username="$env:ES_USERNAME" -password="$env:ES_PASSWORD" `
                   -credential_id="$env:ES_CREDENTIAL_ID" -totp_secret="$env:ES_TOTP_SECRET" `
                   -input_file_path="$path" -output_dir_path="$outDir" 2>&1
            if ($LASTEXITCODE -ne 0) { throw "sign-sidecars: CodeSignTool failed for '$name' (exit $LASTEXITCODE): $($o | Out-String)" }
            $signed = Join-Path $outDir $name
            if (-not (Test-Path $signed)) { throw "sign-sidecars: signed output not found for '$name' in $outDir" }
            Move-Item -Force -Path $signed -Destination $path
            Remove-Item -Recurse -Force -Path $outDir -ErrorAction SilentlyContinue
            Write-Host "signed sidecar: $name"
          }

          # A. Explicit Authenticode verification (present, valid, expected cert by thumbprint+serial, timestamp).
          #    Runs in a normal pwsh step (NOT the console-less process Tauri spawns), so Get-AuthenticodeSignature
          #    works here — the same call the dedicated 'Verify Authenticode' step already makes successfully.
          function Assert-Signed($path, $label) {
            $sig = Get-AuthenticodeSignature $path
            $c = $sig.SignerCertificate
            $tp = if ($c) { "$($c.Thumbprint)" } else { '' }
            $sn = if ($c) { "$($c.SerialNumber)" } else { '' }
            $hasTs = $sig.TimeStamperCertificate -ne $null
            Write-Host "$label : status=$($sig.Status) thumb=$tp serial=$sn timestamp=$hasTs"
            if ($sig.Status -ne 'Valid') { throw "FAIL: $label is not validly signed (status $($sig.Status))" }
            if ($tp -ne "$env:EXPECT_THUMBPRINT") { throw "FAIL: $label thumbprint '$tp' != expected '$env:EXPECT_THUMBPRINT'" }
            if ($sn -ne "$env:EXPECT_SERIAL") { throw "FAIL: $label serial '$sn' != expected '$env:EXPECT_SERIAL'" }
            # B. Mandatory timestamp: without it the signature stops being valid once the cert expires.
            if (-not $hasTs) { throw "FAIL: $label has no timestamp" }
          }

          $bd  = "src-tauri/binaries/bitcoind.exe"
          $cli = "src-tauri/binaries/bitcoin-cli.exe"
          $mw  = "src-tauri/binaries/brisvia-worker.exe"
          # Sign one at a time with a gap: eSigner's TOTP window is 30 s and it rejects a reused OTP, so back-to-back
          # signatures can fail. The 35 s wait guarantees a fresh window per file. (To be confirmed in the CI run.)
          $files = @($bd, $cli, $mw)
          for ($i = 0; $i -lt $files.Count; $i++) {
            if ($i -gt 0) { Start-Sleep -Seconds 35 }
            Sign-InPlace $files[$i]
          }
          Assert-Signed $bd  'sidecar bitcoind.exe'
          Assert-Signed $cli 'sidecar bitcoin-cli.exe'
          Assert-Signed $mw  'sidecar brisvia-worker.exe'

          # C. Record the SIGNED hashes + sizes as the canonical guard values (double guard: hash + size + signature).
          $hbd  = (Get-FileHash $bd  -Algorithm SHA256).Hash.ToLower()
          $hmw  = (Get-FileHash $mw  -Algorithm SHA256).Hash.ToLower()
          $hcli = (Get-FileHash $cli -Algorithm SHA256).Hash.ToLower()
          $szbd  = (Get-Item $bd).Length
          $szmw  = (Get-Item $mw).Length
          $szcli = (Get-Item $cli).Length
          "SIDECAR_SHA256=$hbd" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORKER_SHA256=$hmw"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "CLI_SHA256=$hcli"    | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIDECAR_SIZE=$szbd"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "WORKER_SIZE=$szmw"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "CLI_SIZE=$szcli"     | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "signed sidecar hashes -> bitcoind=$hbd worker=$hmw cli=$hcli"

          # D. Traceability evidence artifact: signed SHA + size + cert + timestamp + build/commit identity.
          $sigbd = Get-AuthenticodeSignature $bd
          $ev = Join-Path $env:RUNNER_TEMP 'sidecar-signing-evidence.txt'
          @(
            "file=bitcoind.exe sha256=$hbd size=$szbd",
            "file=brisvia-worker.exe sha256=$hmw size=$szmw",
            "file=bitcoin-cli.exe sha256=$hcli size=$szcli",
            "cert_thumbprint=$($sigbd.SignerCertificate.Thumbprint)",
            "cert_serial=$($sigbd.SignerCertificate.SerialNumber)",
            "cert_subject=$($sigbd.SignerCertificate.Subject)",
            "timestamped=$($sigbd.TimeStamperCertificate -ne $null)",
            "core_ref=8195a1b0c71d236eb32b8675ffc245e1f6f7fcb1",
            "github_run_id=$env:GITHUB_RUN_ID",
            "github_sha=$env:GITHUB_SHA",
            "github_ref=$env:GITHUB_REF",
            "job_start_utc=$env:JOB_START_UTC",
            "built_utc=$((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Out-File -FilePath $ev -Encoding ascii
          Write-Host "wrote signing evidence to $ev"

      - name: Build the Tauri app and sign (miner + installer) via eSigner
        run: npm run tauri build -- --features mainnet
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

      - name: Show the sign-wrapper log (what signing actually did)
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'sign-wrapper.log'
          if (Test-Path $log) { Write-Host "===== sign-wrapper.log ====="; Get-Content $log }
          else { Write-Host "no sign-wrapper.log — the wrapper never ran or failed before logging" }

      - name: Verify Authenticode signatures (installer + the app binary INSIDE it)
        shell: pwsh
        env:
          EXPECT_THUMBPRINT: ${{ secrets.ES_CERT_THUMBPRINT }}
          EXPECT_SERIAL: ${{ secrets.ES_CERT_SERIAL }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Verify the two things a user actually runs: the NSIS installer, and the brisvia-miner.exe that is
          # INSIDE it (extracted from the finished installer, the same way the packaged-node guard does).
          # We deliberately do NOT verify src-tauri/target/release/brisvia-miner.exe: a -Recurse there can
          # pick up an unsigned build artifact from deps/ and give a false "NotSigned".
          # Identity is checked by certificate THUMBPRINT + SERIAL (a name like "Fernando Del Collado" can be
          # forged; a thumbprint cannot), plus a valid status and a present timestamp.
          function Assert-Signed($path, $label) {
            $sig = Get-AuthenticodeSignature $path
            $c = $sig.SignerCertificate
            $tp = if ($c) { "$($c.Thumbprint)" } else { '' }
            $sn = if ($c) { "$($c.SerialNumber)" } else { '' }
            $hasTs = $sig.TimeStamperCertificate -ne $null
            Write-Host "$label : status=$($sig.Status) thumb=$tp serial=$sn timestamp=$hasTs subject=$($c.Subject)"
            if ($sig.Status -ne 'Valid') { throw "FAIL: $label is not validly signed (status $($sig.Status))" }
            if ($tp -ne "$env:EXPECT_THUMBPRINT") { throw "FAIL: $label thumbprint '$tp' != expected '$env:EXPECT_THUMBPRINT'" }
            if ($sn -ne "$env:EXPECT_SERIAL") { throw "FAIL: $label serial '$sn' != expected '$env:EXPECT_SERIAL'" }
            if (-not $hasTs) { throw "FAIL: $label has no timestamp (the signature would stop being valid when the cert expires)" }
          }
          # 1) the installer itself
          $setup = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'FAIL: cannot find the installer to verify' }
          Assert-Signed $setup.FullName 'installer'
          # 2) the app binary that is actually shipped inside the installer
          $out = Join-Path $env:RUNNER_TEMP 'verify-unpack'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          & 7z x "$($setup.FullName)" "-o$out" -y | Out-Null
          $inner = Get-ChildItem -Path $out -Recurse -Filter brisvia-miner.exe | Select-Object -First 1
          if (-not $inner) { throw 'FAIL: the installer does not contain brisvia-miner.exe' }
          Assert-Signed $inner.FullName 'packaged brisvia-miner.exe'
          # 3) #9 fix: the sidecars users' machines actually run as child processes must also be signed, or
          #    Defender/SmartScreen can quarantine them even though the app is signed. Verify each inside the installer.
          foreach ($sc in @('bitcoind.exe', 'brisvia-worker.exe', 'bitcoin-cli.exe')) {
            $f = Get-ChildItem -Path $out -Recurse -Filter $sc | Select-Object -First 1
            if (-not $f) { throw "FAIL: the installer does not contain $sc" }
            Assert-Signed $f.FullName "packaged $sc"
          }
          # 4) Catch a NEW executable that nobody remembered to sign: enumerate every *.exe in the installer and
          #    fail on anything outside the known set. uninstall.exe is NSIS-generated and (today) not signed, so
          #    it is allowed but not asserted-signed; any OTHER unknown .exe is a hard failure.
          $known = @('brisvia-miner.exe', 'bitcoind.exe', 'brisvia-worker.exe', 'bitcoin-cli.exe', 'uninstall.exe')
          $unexpected = Get-ChildItem -Path $out -Recurse -Filter *.exe | Where-Object { $known -notcontains $_.Name }
          if ($unexpected) { throw "FAIL: the installer contains unexpected executable(s) not in the signed set: $($unexpected.Name -join ', '). Add them to the signing step and this list." }
          Write-Host "OK: the installer and every binary inside it (app + node + worker + cli) are validly signed by the expected certificate; no unexpected executables."

      - name: Stage the installer with a fixed (versionless) name for a permanent link
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Brisvia-Miner-Windows.exe

      - name: Guard - the app binary must target MAINNET (coin 9339)
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path src-tauri/target/release -Filter brisvia-miner.exe -Recurse | Select-Object -First 1
          $txt = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($bin.FullName))
          if ($txt -notmatch '9339h') { throw 'FAIL: the binary is NOT mainnet (missing coin 9339h). Compile with --features mainnet.' }
          Write-Host 'OK: mainnet binary (9339h present)'

      - name: Guard - the PACKAGED node is the one this job compiled
        shell: pwsh
        run: |
          # The other half of the provenance guard: staging the right binary proves nothing if the packaged
          # installer ends up carrying a different one. Extract the sidecar back OUT of the finished
          # installer and compare it to the hash recorded at staging time. A mismatch means the thing users
          # download is not the node we built and tested — a different network, discovered on launch day.
          $setup = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'FAIL: cannot find the installer to verify the packaged node' }
          $out = Join-Path $env:RUNNER_TEMP 'unpack'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          & 7z x "$($setup.FullName)" "-o$out" -y | Out-Null
          # Double guard (hash + size) for BOTH the node and the worker: the canonical values were recorded
          # from the SIGNED sidecars, so a match proves the installer ships exactly the signed bytes this job
          # produced. Checking size too covers the astronomically-unlikely case of a human-set expected SHA.
          function Assert-PackagedMatches($filter, $expectedSha, $expectedSize, $label) {
            $packed = Get-ChildItem -Path $out -Recurse -Filter $filter | Select-Object -First 1
            if (-not $packed) { throw "FAIL: the installer does not contain $filter" }
            $ph = (Get-FileHash $packed.FullName -Algorithm SHA256).Hash.ToLower()
            $psz = (Get-Item $packed.FullName).Length
            Write-Host "packaged $label : sha=$ph size=$psz"
            Write-Host "compiled $label : sha=$expectedSha size=$expectedSize"
            if ($ph -ne $expectedSha) { throw "FAIL: the $label inside the installer ($ph) is not the one this job signed ($expectedSha)." }
            if ("$psz" -ne "$expectedSize") { throw "FAIL: the $label inside the installer has size $psz, expected $expectedSize." }
          }
          Assert-PackagedMatches 'bitcoind.exe'       $env:SIDECAR_SHA256 $env:SIDECAR_SIZE 'node'
          Assert-PackagedMatches 'brisvia-worker.exe' $env:WORKER_SHA256  $env:WORKER_SIZE  'worker'
          Assert-PackagedMatches 'bitcoin-cli.exe'    $env:CLI_SHA256     $env:CLI_SIZE     'cli'
          Write-Host 'OK: the packaged node, worker and cli are exactly the signed binaries this job produced'

      - name: Guard - the packaged node really is the Brisvia main network
        shell: pwsh
        run: |
          # Run the packaged node and ask IT which chain and genesis it has, instead of trusting the source
          # tree. Cheap, and it is the only check that would have caught a stale sidecar.
          $out = Join-Path $env:RUNNER_TEMP 'unpack'
          $bd  = (Get-ChildItem -Path $out -Recurse -Filter bitcoind.exe | Select-Object -First 1).FullName
          $cli = (Get-ChildItem -Path $out -Recurse -Filter bitcoin-cli.exe | Select-Object -First 1).FullName
          $dd  = Join-Path $env:RUNNER_TEMP 'chainprobe'
          Remove-Item $dd -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dd | Out-Null
          "server=1`nrpcuser=t`nrpcpassword=t`nlisten=0`n[brisvia]`nrpcport=28455" | Out-File -Encoding ascii "$dd/bitcoin.conf"
          $p = Start-Process -FilePath $bd -ArgumentList "-datadir=$dd","-chain=brisvia" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 15
          $args = @("-datadir=$dd","-chain=brisvia","-rpcport=28455","-rpcuser=t","-rpcpassword=t")
          $genesis = (& $cli @args getblockhash 0) 2>&1
          $chain   = (& $cli @args getblockchaininfo) 2>&1 | Out-String
          & $cli @args stop 2>&1 | Out-Null
          Start-Sleep -Seconds 3
          if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "packaged node genesis: $genesis"
          if ("$genesis".Trim() -ne 'aa6bc268339aa9f4f2e39ae33aca7b7e48e395033d08d37c08f828890af7baf7') {
            throw "FAIL: the packaged node has genesis $genesis, not the real Brisvia network's."
          }
          if ($chain -notmatch '"chain":\s*"brisvia"') { throw 'FAIL: the packaged node is not on the brisvia network' }
          Write-Host 'OK: the packaged node is the real Brisvia network (genesis aa6bc268...)'

      - name: Upload sidecar signing evidence (traceability)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-signing-evidence
          path: ${{ runner.temp }}/sidecar-signing-evidence.txt
          if-no-files-found: ignore

      - name: Attach the installer and the signed updater artifact to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            Brisvia-Miner-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
