name: Diagnose Windows test loader failure

# Disposable diagnostic. Builds nothing that ships, publishes nothing, touches no tag, fixes nothing.
# Read-only permissions and a manual trigger on purpose: it has no business writing anywhere.
#
# THE QUESTION
# ------------
# rc6's Windows job died at the Rust test step:
#
#   brisvia_miner_lib-2916f99034f113b9.exe wallet_key_tests --nocapture
#   (exit code: 0xc0000139, STATUS_ENTRYPOINT_NOT_FOUND)
#
# rc4 and rc5 passed that same step, so bisection narrows the regression to the rc5-rc6 change set. The
# MECHANISM is not proven, and that is the only thing this workflow exists for.
#
# 0xc0000139 means Windows loaded a DLL and could not find inside it a procedure the executable imports.
# It is NOT "a DLL is missing" -- that is 0xc0000135. So the honest statement is: the new test executable
# imports a function that does not exist in the version of some DLL Windows resolves. Which DLL and which
# function are unknown.
#
# `wallet_key_tests` in the message does not incriminate that test. Cargo builds ONE executable for the
# whole library and applies the name filter at run time. If the loader cannot start the .exe, no test runs
# at all -- that name is just the one it was about to try.
#
# THREE ATTEMPTS AT THIS PROVED NOTHING, AND EVERY REASON WAS MINE
# ---------------------------------------------------------------
#   1. windows-latest instead of windows-2022     a different image entirely
#   2. RandomX never built                        so RANDOMX_LIB was never set
#   3. RANDOMX_LIB_DIR absent                     -> "failed to run custom build command"
#   4. --features mainnet omitted                 not even the same binary
#   5. two parallel trees, different cwd          tauri.conf.json resolves frontendDist as
#                                                 ../src/renderer -- relative
#   6. steps 7, 8, 10 and 11 skipped              -> "resource path binaries\bitcoind.exe doesn't exist"
#
# Number 6 was dismissed once by checking externalBin, which is None, and concluding Tauri did not need
# the binaries. That was the wrong field. The hypothesis was right and got buried by a bad check -- worse
# than not checking, because it came with confidence.
#
# So: every step below is copied from the real job that built rc5 successfully. Nothing is simplified
# because it "looks unnecessary to a library test". That judgement was made three times and was wrong
# three times.
#
# THE GATE
# --------
# rc5 itself is the proof that this reproduction works. If it does not build and list its tests here, the
# run stops before dumpbin: comparing two broken things proves nothing.

on:
  workflow_dispatch:
    inputs:
      good_tag:
        description: "Tag whose tests PASS (baseline)"
        required: true
        default: "v1.0.6-rc5"
      bad_tag:
        description: "Tag whose tests FAIL"
        required: true
        default: "v1.0.6-rc6"

permissions:
  contents: read

jobs:
  # Two minutes that decide whether eighty are worth spending. The long job cannot start until this
  # passes: see `needs:` below.
  #
  # This exists because building this diagnostic cost seven self-inflicted bugs, each found by burning a
  # 40-to-80 minute run. On its very first local run this gate found four more -- including a real bug in
  # its own process capture and a metatest that asserted something untrue. Every one of them was in the
  # tool, none in the product.
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Prove the diagnostic tool works before spending an hour on it
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/Test-DiagnosticPreflight.ps1 -ManifestPath preflight-manifest.json

      - name: The manifest must be readable by something other than PowerShell
        shell: pwsh
        run: |
          # Read it back as bytes, not through PowerShell's reader: it opens its own BOM'd files happily
          # and would report success while json.load, jq and fromJSON all choke on the first character.
          $bytes = [IO.File]::ReadAllBytes("$PWD/preflight-manifest.json")
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "the manifest has a UTF-8 BOM: the consuming side cannot parse it"
          }
          $m = [Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
          Write-Host "status=$($m.status)  checks=$($m.checks_total)  failed=$($m.checks_failed)"
          if ($m.status -ne 'PASS') { throw "preflight says $($m.status): the long diagnostic does not start" }
          foreach ($k in $m.script_hashes.PSObject.Properties.Name) {
            Write-Host "  $k = $($m.script_hashes.$k)"
          }
          "MANIFEST_SHA256=$((Get-FileHash preflight-manifest.json -Algorithm SHA256).Hash)" |
            Out-File -Append $env:GITHUB_ENV

      - name: Keep the manifest whatever happens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-manifest
          path: preflight-manifest.json

  compare:
    # The whole point: no long run starts on an unproven tool.
    needs: preflight
    # windows-2022, exactly like the real job. windows-latest is a moving target.
    runs-on: windows-2022
    steps:
      # The helper comes from the APPROVED commit, and lives OUTSIDE the workspace.
      #
      # Two reasons, both of which would have cost an 80-minute run to discover:
      #   1. rc5 and rc6 do not contain tools/ci/ -- it was written after both tags. Dot-sourcing it from
      #      the workspace would fail with "file not found" on the very first use.
      #   2. The workspace gets wiped between the two halves. Anything left in it disappears.
      #
      # It also has to be the version the preflight approved, not whatever a tag happens to carry:
      # measuring rc5 and rc6 with two different rulers would be its own bug.
      - name: Bring in the approved diagnostic tool, outside the workspace
        uses: actions/checkout@v4
        with:
          path: approved-tools

      - name: Park it where the wipe cannot reach it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          Copy-Item approved-tools\tools\ci\*.ps1 C:\tools\ -Force

          # Collect the hashes BEFORE writing anything, and write the list somewhere else.
          #
          # The first version piped Get-ChildItem C:\tools into Tee-Object C:\tools\hashes.txt: the file
          # appeared inside the directory mid-enumeration, and Get-FileHash then tried to read it while
          # Tee-Object still held it open. Writing into the folder you are walking is a classic. It cost
          # thirty seconds here instead of eighty minutes further in, which is the entire argument for
          # the gate this job depends on.
          $hashes = @(Get-ChildItem C:\tools -Filter *.ps1 | ForEach-Object {
            "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          })
          $hashes | ForEach-Object { Write-Host "  $_" }
          $hashes | Out-File C:\tools-hashes.txt

          # Fail closed. Without this, every later step dies one at a time with a confusing
          # "command not found" instead of saying what is actually wrong.
          if (-not (Test-Path C:\tools\Invoke-NativeProcess.ps1)) {
            throw "the approved helper is not in C:\tools: the diagnostic cannot measure anything"
          }
          Remove-Item approved-tools -Recurse -Force

      - name: MSVC tools (dumpbin lives here)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Record the environment both halves share
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\evidence | Out-Null
          $env:PATH | Out-File C:\evidence\PATH.txt
          "image=$env:ImageOS $env:ImageVersion runner=$env:RUNNER_OS $env:RUNNER_ARCH" |
            Tee-Object C:\evidence\runner.txt

      # ========================= BASELINE: the tag that passes =========================
      # Both halves build one after the other in the SAME physical path. Two parallel trees put src-tauri
      # at a different depth and frontendDist stops resolving.
      - name: BASELINE - checkout desktop app
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.good_tag }}
          clean: true

      - name: BASELINE - checkout core (with the RandomX submodule)
        uses: actions/checkout@v4
        with:
          repository: brisvia/brisvia
          submodules: recursive
          path: core

      - name: BASELINE - build RandomX (static lib, portable)
        shell: pwsh
        run: |
          cmake -S core/src/randomx -B core/src/randomx/build -DCMAKE_BUILD_TYPE=Release -DARCH=default -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build core/src/randomx/build --config Release -j
          $rx = Get-ChildItem -Path core/src/randomx/build -Recurse -Filter randomx.lib | Select-Object -First 1
          if (-not $rx) { throw "INVALID DIAGNOSTIC: RandomX produced no randomx.lib" }
          echo "RANDOMX_LIB=$($rx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RANDOMX_LIB=$($rx.FullName)"

      - name: BASELINE - mark job start (the staging guard requires it)
        shell: pwsh
        run: |
          $t = (Get-Date).ToUniversalTime().ToString("o")
          "JOB_START_UTC=$t" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "job start (UTC): $t"

      - name: BASELINE - configure and build bitcoind + bitcoin-cli (MSVC + vcpkg, wallet only)
        shell: pwsh
        working-directory: core
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT   # GitHub Windows runners ship vcpkg here
          cmake --preset vs2022-static -B build -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON -DVCPKG_MANIFEST_FEATURES=wallet -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DWITH_ZMQ=OFF -DENABLE_IPC=OFF -DBRISVIA_RANDOMX_LIB="$env:RANDOMX_LIB" -DBRISVIA_RANDOMX_INCLUDE="$PWD/src/randomx/src"
          cmake --build build --config Release --target bitcoind bitcoin-cli -j

      - name: BASELINE - setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: BASELINE - build the miner (mine-once)
        shell: pwsh
        run: |
          $env:RANDOMX_LIB_DIR = (Split-Path $env:RANDOMX_LIB)
          cargo build --release --manifest-path crates/brisvia-randomx/Cargo.toml --bin mine-once

      - name: BASELINE - stage binaries (.exe)
        shell: pwsh
        run: |
          # Copied from the real job, provenance guard included: the binary must be UNIQUE and must have
          # been produced by THIS run. A stale node is not a loud failure -- it is a DIFFERENT NETWORK
          # that only shows up on launch day.
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Remove-Item src-tauri/binaries/* -Force -ErrorAction SilentlyContinue
          function Take-One($path, $filter, $extra) {
            $all = @(Get-ChildItem -Path $path -Recurse -Filter $filter -ErrorAction SilentlyContinue)
            if ($extra) { $all = @($all | Where-Object $extra) }
            if ($all.Count -eq 0) { throw "FAIL: no $filter was built by this job." }
            if ($all.Count -gt 1) { throw "FAIL: $($all.Count) copies of $filter; cannot tell which is this build's: $($all.FullName -join ', ')" }
            if ($all[0].LastWriteTimeUtc -lt [datetime]::Parse($env:JOB_START_UTC)) {
              throw "FAIL: $filter predates the job start ($($all[0].LastWriteTimeUtc) < $env:JOB_START_UTC): this build did not produce it."
            }
            return $all[0]
          }
          $bd  = Take-One "core/build" "bitcoind.exe" $null
          $cli = Take-One "core/build" "bitcoin-cli.exe" $null
          $mw  = Take-One "." "mine-once.exe" { $_.FullName -match 'release' }
          Copy-Item $bd.FullName  src-tauri/binaries/bitcoind.exe
          Copy-Item $cli.FullName src-tauri/binaries/bitcoin-cli.exe
          Copy-Item $mw.FullName  src-tauri/binaries/brisvia-worker.exe
          Get-ChildItem src-tauri/binaries

      - name: BASELINE - the three binaries exist, right before cargo
        shell: pwsh
        run: |
          # The last run died on "resource path binaries\bitcoind.exe doesn't exist" AFTER a long build.
          # This says so in one second instead, and records what cargo is about to be handed.
          foreach ($f in @('bitcoind.exe', 'bitcoin-cli.exe', 'brisvia-worker.exe')) {
            $p = "src-tauri/binaries/$f"
            if (-not (Test-Path $p)) { throw "INVALID DIAGNOSTIC: $p is missing. Tauri's build script needs it." }
            $i = Get-Item $p
            $h = (Get-FileHash $p -Algorithm SHA256).Hash
            "$f size=$($i.Length) sha256=$h" | Tee-Object -Append C:\evidence\good-env.txt
          }

      - name: BASELINE - build the test executable (no run)
        shell: pwsh
        env:
          CARGO_INCREMENTAL: 0
        run: |
          # RANDOMX_LIB_DIR, --features mainnet and --manifest-path all come from the real job. Without
          # them this builds a different binary, or nothing at all, and compares neither.
          $env:RANDOMX_LIB_DIR = (Split-Path $env:RANDOMX_LIB)
          "tag=${{ inputs.good_tag }}"           | Tee-Object -Append C:\evidence\good-env.txt
          "sha=$(git rev-parse HEAD)"            | Tee-Object -Append C:\evidence\good-env.txt
          "cwd=$PWD"                             | Tee-Object -Append C:\evidence\good-env.txt
          "RANDOMX_LIB=$env:RANDOMX_LIB"         | Tee-Object -Append C:\evidence\good-env.txt
          "RANDOMX_LIB_DIR=$env:RANDOMX_LIB_DIR" | Tee-Object -Append C:\evidence\good-env.txt
          rustc -Vv | Tee-Object -Append C:\evidence\good-env.txt
          cargo -V  | Tee-Object -Append C:\evidence\good-env.txt

          $json = cargo test --manifest-path src-tauri/Cargo.toml --features mainnet --lib --no-run --message-format=json
          $json | Out-File C:\evidence\good-cargo-json.txt

          # profile.test marks THIS artifact as a test binary. target.test only says a target CAN be
          # tested -- filtering on that matched nothing and cost a whole run.
          $found = @()
          foreach ($line in $json) {
            if ($line -notmatch '^\s*\{') { continue }
            try { $m = $line | ConvertFrom-Json } catch { continue }
            if ($m.reason -eq 'compiler-artifact' -and $m.executable -and $m.profile.test -eq $true) {
              $found += $m.executable
            }
          }
          if ($found.Count -eq 0) { throw "INVALID DIAGNOSTIC: the baseline built no test executable. Nothing to compare." }
          if ($found.Count -gt 1) { throw "INVALID DIAGNOSTIC: $($found.Count) test executables; cannot tell which is under test." }
          $exe = $found[0]
          Copy-Item $exe C:\evidence\test-good.exe
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          "exe=$exe size=$((Get-Item $exe).Length) sha256=$h" | Tee-Object -Append C:\evidence\good-env.txt
          Get-ChildItem (Split-Path $exe) -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Name } | Out-File C:\evidence\good-dlls-next-to-exe.txt

      - name: BASELINE - does it load? (--list)
        shell: pwsh
        run: |
          # THE gate. --list needs the executable to LOAD but runs no test.
          #
          # This used to be a pipeline into Select-Object -First 10, which stops the pipeline and leaves
          # $LASTEXITCODE unset. The evidence read `exit= hex=0x`, the step threw, and a baseline that
          # may have loaded perfectly was rejected. The helper takes the code from the process object and
          # never puts the executable in a pipeline; truncating for display happens afterwards and cannot
          # reach it. Proven by the preflight this job depends on.
          . C:	ools\Invoke-NativeProcess.ps1
          $r = Invoke-NativeProcess -FilePath C:\evidence\test-good.exe -Arguments @('--list') -OutputDir C:\evidence
          Write-NativeProcessReport -Result $r -PreviewLines 10
          $r | ConvertTo-Json -Depth 4 | Out-File C:\evidence\good-list.json
          if (-not $r.Launched) {
            throw "INVALID DIAGNOSTIC: the baseline executable did not even start: $($r.Error)"
          }
          if ($r.ExitCode -ne 0) {
            throw "INVALID DIAGNOSTIC: the baseline does not load either (exit $($r.ExitCode) / $($r.ExitCodeHex)). The environment still differs from the real job. Find that difference before comparing anything."
          }
          Write-Host "the baseline loads and lists its tests. Gate open."

      - name: BASELINE - what it imports
        shell: pwsh
        run: |
          dumpbin /DEPENDENTS C:\evidence\test-good.exe > C:\evidence\dependents-good.txt 2>&1
          dumpbin /IMPORTS    C:\evidence\test-good.exe > C:\evidence\imports-good.txt    2>&1

      - name: Wipe the workspace between halves
        shell: pwsh
        run: |
          # Everything of the baseline goes, so none of it can be mistaken for the candidate's.
          Get-ChildItem -Path . -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $left = @(Get-ChildItem -Path . -Force -ErrorAction SilentlyContinue).Count
          Write-Host "files left in the workspace: $left"
          if ($left -gt 0) { throw "the workspace is not clean; the candidate would build on top of the baseline" }

      # ========================= CANDIDATE: the tag that fails =========================
      - name: CANDIDATE - checkout desktop app
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bad_tag }}
          clean: true

      - name: CANDIDATE - checkout core (with the RandomX submodule)
        uses: actions/checkout@v4
        with:
          repository: brisvia/brisvia
          submodules: recursive
          path: core

      - name: CANDIDATE - build RandomX (static lib, portable)
        shell: pwsh
        run: |
          cmake -S core/src/randomx -B core/src/randomx/build -DCMAKE_BUILD_TYPE=Release -DARCH=default -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build core/src/randomx/build --config Release -j
          $rx = Get-ChildItem -Path core/src/randomx/build -Recurse -Filter randomx.lib | Select-Object -First 1
          if (-not $rx) { throw "RandomX produced no randomx.lib" }
          echo "RANDOMX_LIB=$($rx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RANDOMX_LIB=$($rx.FullName)"

      - name: CANDIDATE - mark job start (the staging guard requires it)
        shell: pwsh
        run: |
          $t = (Get-Date).ToUniversalTime().ToString("o")
          "JOB_START_UTC=$t" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "job start (UTC): $t"

      - name: CANDIDATE - configure and build bitcoind + bitcoin-cli (MSVC + vcpkg, wallet only)
        shell: pwsh
        working-directory: core
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset vs2022-static -B build -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON -DVCPKG_MANIFEST_FEATURES=wallet -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DWITH_ZMQ=OFF -DENABLE_IPC=OFF -DBRISVIA_RANDOMX_LIB="$env:RANDOMX_LIB" -DBRISVIA_RANDOMX_INCLUDE="$PWD/src/randomx/src"
          cmake --build build --config Release --target bitcoind bitcoin-cli -j

      - name: CANDIDATE - setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: CANDIDATE - build the miner (mine-once)
        shell: pwsh
        run: |
          $env:RANDOMX_LIB_DIR = (Split-Path $env:RANDOMX_LIB)
          cargo build --release --manifest-path crates/brisvia-randomx/Cargo.toml --bin mine-once

      - name: CANDIDATE - stage binaries (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Remove-Item src-tauri/binaries/* -Force -ErrorAction SilentlyContinue
          function Take-One($path, $filter, $extra) {
            $all = @(Get-ChildItem -Path $path -Recurse -Filter $filter -ErrorAction SilentlyContinue)
            if ($extra) { $all = @($all | Where-Object $extra) }
            if ($all.Count -eq 0) { throw "FAIL: no $filter was built by this job." }
            if ($all.Count -gt 1) { throw "FAIL: $($all.Count) copies of $filter: $($all.FullName -join ', ')" }
            if ($all[0].LastWriteTimeUtc -lt [datetime]::Parse($env:JOB_START_UTC)) {
              throw "FAIL: $filter predates the job start: this build did not produce it."
            }
            return $all[0]
          }
          $bd  = Take-One "core/build" "bitcoind.exe" $null
          $cli = Take-One "core/build" "bitcoin-cli.exe" $null
          $mw  = Take-One "." "mine-once.exe" { $_.FullName -match 'release' }
          Copy-Item $bd.FullName  src-tauri/binaries/bitcoind.exe
          Copy-Item $cli.FullName src-tauri/binaries/bitcoin-cli.exe
          Copy-Item $mw.FullName  src-tauri/binaries/brisvia-worker.exe
          Get-ChildItem src-tauri/binaries

      - name: CANDIDATE - the three binaries exist, right before cargo
        shell: pwsh
        run: |
          foreach ($f in @('bitcoind.exe', 'bitcoin-cli.exe', 'brisvia-worker.exe')) {
            $p = "src-tauri/binaries/$f"
            if (-not (Test-Path $p)) { throw "$p is missing. Tauri's build script needs it." }
            $i = Get-Item $p
            $h = (Get-FileHash $p -Algorithm SHA256).Hash
            "$f size=$($i.Length) sha256=$h" | Tee-Object -Append C:\evidence\bad-env.txt
          }

      - name: CANDIDATE - build the test executable (no run)
        shell: pwsh
        env:
          CARGO_INCREMENTAL: 0
        run: |
          $env:RANDOMX_LIB_DIR = (Split-Path $env:RANDOMX_LIB)
          "tag=${{ inputs.bad_tag }}"            | Tee-Object -Append C:\evidence\bad-env.txt
          "sha=$(git rev-parse HEAD)"            | Tee-Object -Append C:\evidence\bad-env.txt
          "cwd=$PWD"                             | Tee-Object -Append C:\evidence\bad-env.txt
          "RANDOMX_LIB=$env:RANDOMX_LIB"         | Tee-Object -Append C:\evidence\bad-env.txt
          "RANDOMX_LIB_DIR=$env:RANDOMX_LIB_DIR" | Tee-Object -Append C:\evidence\bad-env.txt
          rustc -Vv | Tee-Object -Append C:\evidence\bad-env.txt
          cargo -V  | Tee-Object -Append C:\evidence\bad-env.txt

          $json = cargo test --manifest-path src-tauri/Cargo.toml --features mainnet --lib --no-run --message-format=json
          $json | Out-File C:\evidence\bad-cargo-json.txt
          $found = @()
          foreach ($line in $json) {
            if ($line -notmatch '^\s*\{') { continue }
            try { $m = $line | ConvertFrom-Json } catch { continue }
            if ($m.reason -eq 'compiler-artifact' -and $m.executable -and $m.profile.test -eq $true) {
              $found += $m.executable
            }
          }
          if ($found.Count -ne 1) { throw "the candidate reported $($found.Count) test executables, expected exactly 1" }
          $exe = $found[0]
          Copy-Item $exe C:\evidence\test-bad.exe
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          "exe=$exe size=$((Get-Item $exe).Length) sha256=$h" | Tee-Object -Append C:\evidence\bad-env.txt
          Get-ChildItem (Split-Path $exe) -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Name } | Out-File C:\evidence\bad-dlls-next-to-exe.txt

      - name: CANDIDATE - does it load? (--list)
        shell: pwsh
        continue-on-error: true
        run: |
          # The point of the whole workflow. A non-zero code here with the baseline at zero proves the
          # failure belongs to LOADING the executable, not to any test's logic -- and specifically not to
          # wallet_key_tests, which the real job's message names only because it was the first on the
          # list when the loader gave up.
          #
          # A loader failure produces no output at all: the process dies before reaching its own code. So
          # the exit code IS the evidence, which is exactly why it cannot be read through a pipeline.
          . C:	ools\Invoke-NativeProcess.ps1
          $r = Invoke-NativeProcess -FilePath C:\evidence\test-bad.exe -Arguments @('--list') -OutputDir C:\evidence
          Write-NativeProcessReport -Result $r -PreviewLines 10
          $r | ConvertTo-Json -Depth 4 | Out-File C:\evidence\bad-list.json

          if (-not $r.Launched) {
            Write-Host "the candidate executable did not start at all: $($r.Error)"
          }
          elseif ($r.ExitCodeHex -eq '0xC0000139') {
            Write-Host "CASE A - REPRODUCED: the same loader failure as the real job (exit $($r.ExitCode))."
          }
          elseif ($r.ExitCode -eq 0) {
            Write-Host "CASE C - IT LOADS HERE. The real job's failure needs another explanation: compare"
            Write-Host "         this environment against run 29448577901 before attributing any cause."
          }
          else {
            Write-Host "a different failure ($($r.ExitCodeHex)): not the one under investigation."
          }

      - name: CANDIDATE - what it imports
        shell: pwsh
        continue-on-error: true
        run: |
          dumpbin /DEPENDENTS C:\evidence\test-bad.exe > C:\evidence\dependents-bad.txt 2>&1
          dumpbin /IMPORTS    C:\evidence\test-bad.exe > C:\evidence\imports-bad.txt    2>&1

      - name: What the candidate asks for and the baseline does not
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== DLLs only the candidate needs ==="
          $rxDll = '^\s+(\S+\.dll)\s*$'
          $g = @(Select-String -Path C:\evidence\dependents-good.txt -Pattern $rxDll | ForEach-Object { $_.Matches.Groups[1].Value })
          $b = @(Select-String -Path C:\evidence\dependents-bad.txt  -Pattern $rxDll | ForEach-Object { $_.Matches.Groups[1].Value })
          $new = @(Compare-Object $g $b | Where-Object { $_.SideIndicator -eq '=>' } | ForEach-Object { $_.InputObject })
          if ($new.Count -gt 0) { $new | ForEach-Object { Write-Host "  NEW: $_" } } else { Write-Host "  (none)" }
          $new | Out-File C:\evidence\new-dlls.txt

          # /IMPORTS is the evidence that matters: 0xc0000139 is about a FUNCTION, not about a file.
          Write-Host "=== imported symbols only the candidate has ==="
          $rxSym = '^\s+[0-9A-F]{1,8}\s+(\w\S*)\s*$'
          $fg = @(Select-String -Path C:\evidence\imports-good.txt -Pattern $rxSym | ForEach-Object { $_.Matches.Groups[1].Value })
          $fb = @(Select-String -Path C:\evidence\imports-bad.txt  -Pattern $rxSym | ForEach-Object { $_.Matches.Groups[1].Value })
          $df = @(Compare-Object $fg $fb | Where-Object { $_.SideIndicator -eq '=>' } | ForEach-Object { $_.InputObject })
          Write-Host "  $($df.Count) new imported symbols"
          $df | Select-Object -First 40 | ForEach-Object { Write-Host "    $_" }
          $df | Out-File C:\evidence\new-imports.txt

      - name: For each new DLL, does the copy Windows resolves export what is asked?
        shell: pwsh
        continue-on-error: true
        run: |
          # The proof is a PAIR: the executable imports FunctionX from LibraryY.dll, and the LibraryY.dll
          # Windows actually resolves does not export FunctionX. Anything short of that is a guess.
          if (-not (Test-Path C:\evidence\new-dlls.txt)) { Write-Host "no new DLLs"; exit 0 }
          foreach ($d in (Get-Content C:\evidence\new-dlls.txt | Where-Object { $_ })) {
            $real = (Get-Command $d -ErrorAction SilentlyContinue).Source
            if (-not $real) {
              $near = Join-Path (Split-Path C:\evidence\test-bad.exe) $d
              if (Test-Path $near) { $real = $near }
            }
            if ($real) {
              $h = (Get-FileHash $real -Algorithm SHA256).Hash
              $v = (Get-Item $real).VersionInfo.FileVersion
              Write-Host "$d -> $real (version $v, sha256 $h)"
              "$d $real $v $h" | Out-File -Append C:\evidence\resolved-dlls.txt
              $out = "C:\evidence\exports-" + ($d -replace '\.dll$', '') + ".txt"
              dumpbin /EXPORTS $real > $out 2>&1
            } else {
              Write-Host "$d -> NOT FOUND on PATH or next to the executable"
              "$d NOT-FOUND" | Out-File -Append C:\evidence\resolved-dlls.txt
            }
          }

      - name: Keep everything, whatever the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-loader-evidence
          path: C:\evidence\
