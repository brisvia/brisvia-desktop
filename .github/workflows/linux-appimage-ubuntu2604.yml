name: Linux - does the AppImage open on Ubuntu 24.04 / 26.04?

# A user on Ubuntu 26.04 (ThinkPad T430, Intel HD 4000, Wayland) reported the AppImage never opening.
# Two causes were diagnosed by hand and only one of them was ever fixed:
#
#   1. The AppImage bundles GLib 2.72 (libgio-2.0.so.0.7200.4). The host's GIO/GVFS modules are newer and
#      call g_task_set_static_name, which does not exist in 2.72, so loading them fails. Still present in
#      1.1.0 — verified by listing the published artifact.
#   2. WebKitGTK failed to create an EGL display. Fixed in the app itself: on Linux it now defaults
#      WEBKIT_DISABLE_DMABUF_RENDERER and WEBKIT_DISABLE_COMPOSITING_MODE. That shipped in 1.1.0.
#
# The blocker was that nobody could reproduce it: the reporter's laptop was the only Ubuntu 26.04 around.
# This runs the real artifact inside a real Ubuntu 26.04 container, with and without the bundled GLib, and
# says which one gets further. It proves or disproves cause 1 without needing that laptop.
#
# It never publishes anything. Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write        # draft releases are only visible to write-level tokens

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false               # a failure on one Ubuntu must not cancel the other — we want both verdicts
      matrix:
        ubuntu: ["24.04", "26.04"]
    name: does the AppImage open on Ubuntu ${{ matrix.ubuntu }}
    container:
      image: ubuntu:${{ matrix.ubuntu }}
      options: --privileged        # the AppImage runtime wants FUSE; we extract instead, but keep it permissive
    steps:
      - name: Install what a desktop Ubuntu would already have
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates file xvfb jq \
            libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 \
            gvfs libglib2.0-0 libglib2.0-bin zstd
          # 26.04 renamed the package (the 64-bit time_t transition), so do not query one fixed name.
          echo "host GLib package:"; dpkg -l | grep -E 'libglib2\.0-0' || true
          echo "host GLib soname:"; ls -l /usr/lib/x86_64-linux-gnu/libglib-2.0.so.0* || true

      - name: Download the AppImage (authenticated API — resolves draft releases too)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          V="${TAG#v}"
          NAME="Brisvia.Miner_${V}_amd64.AppImage"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          # A draft release has no public download URL AND is not served by /releases/tags/<tag> (both 404),
          # so LIST /releases (a push-scoped token sees drafts), filter by tag_name to get the asset id, then
          # pull the bytes with Accept: octet-stream. Works for draft and published releases alike.
          AID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases?per_page=100" \
            | jq -r --arg T "$TAG" --arg N "$NAME" '.[] | select(.tag_name==$T) | .assets[] | select(.name==$N) | .id')
          test -n "$AID" || { echo "asset $NAME not found in release $TAG"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o app.AppImage "$API/releases/assets/${AID}"
          chmod +x app.AppImage
          sha256sum app.AppImage

      - name: What GLib does it carry?
        run: |
          set -eux
          ./app.AppImage --appimage-extract >/dev/null
          mv squashfs-root original
          echo "::group::bundled GLib family"
          find original -name 'lib*glib*so*' -o -name 'libgio*so*' -o -name 'libgobject*so*' -o -name 'libgmodule*so*' | sort
          echo "::endgroup::"

      - name: Make a copy without the bundled GLib
        run: |
          set -eux
          cp -a original repacked
          # These four are on the official AppImage excludelist precisely because they have to match the
          # host's GIO/GVFS modules. Built on 22.04 (GLib 2.72) and GLib is forward compatible, so every
          # supported host can satisfy what the bundled GTK/WebKit ask for.
          find repacked -type f \( -name 'libglib-2.0.so*' -o -name 'libgio-2.0.so*' \
               -o -name 'libgobject-2.0.so*' -o -name 'libgmodule-2.0.so*' \) -print -delete

      - name: Run both, and see how far each one gets
        run: |
          set -x
          run_case () {
            DIR="$1"; NAME="$2"
            echo "::group::$NAME"
            # 20s is plenty: the failures we are hunting happen during start-up, not later.
            timeout 20 xvfb-run -a "$DIR/AppRun" > "$NAME.out" 2> "$NAME.err" || true
            echo "--- stderr ---"; tail -40 "$NAME.err" || true
            if grep -q "g_task_set_static_name" "$NAME.err"; then
              echo "RESULT[$NAME]: GLib clash PRESENT"
            else
              echo "RESULT[$NAME]: no GLib clash"
            fi
            if grep -qi "EGL_BAD_PARAMETER\|Could not create default EGL display" "$NAME.err"; then
              echo "RESULT[$NAME]: EGL failure PRESENT"
            else
              echo "RESULT[$NAME]: no EGL failure"
            fi
            echo "::endgroup::"
          }
          run_case original as-published
          run_case repacked without-bundled-glib

      - name: Verdict
        run: |
          set -e
          echo "=============================================="
          for f in as-published without-bundled-glib; do
            echo "--- $f"
            grep -q "g_task_set_static_name" "$f.err" && echo "    GLib clash:  YES" || echo "    GLib clash:  no"
            grep -qi "EGL_BAD_PARAMETER" "$f.err"      && echo "    EGL failure: YES" || echo "    EGL failure: no"
          done
          echo "=============================================="
          echo "Reading this: if 'as-published' shows the GLib clash and 'without-bundled-glib' does not,"
          echo "cause 1 is confirmed and dropping the bundled GLib is the fix. EGL under Xvfb is software"
          echo "rendering, so an EGL line here says little about Intel HD 4000 on Wayland either way."

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-2604-logs
          path: |
            *.out
            *.err

  # ChatGPT's one remaining blocker before GO: the .deb was never actually installed and opened. Integrity
  # (size/sha256) proves the file is well formed, not that apt resolves its deps, the app lands, the sidecars
  # run and it opens. This installs the EXACT .deb from the draft on a clean Ubuntu 24.04 and opens it once.
  deb-smoke:
    runs-on: ubuntu-latest
    name: does the .deb install and open on Ubuntu 24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: What a desktop Ubuntu would already have
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates jq file xvfb \
            libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 gvfs libglib2.0-0 libglib2.0-bin

      - name: Download the EXACT .deb from the draft (authenticated API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eux
          V="${TAG#v}"
          NAME="Brisvia.Miner_${V}_amd64.deb"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/releases?per_page=100" \
            | jq -r --arg T "$TAG" --arg N "$NAME" '.[] | select(.tag_name==$T) | .assets[] | select(.name==$N) | .id')
          test -n "$AID" || { echo ".deb $NAME not found in release $TAG"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o app.deb "$API/releases/assets/${AID}"
          echo "downloaded .deb sha256 + size:"; sha256sum app.deb; stat -c '%s bytes' app.deb

      - name: Install it with apt (must resolve dependencies and finish)
        run: |
          set -eux
          PKG=$(dpkg-deb -f app.deb Package); echo "PKG=$PKG" >> "$GITHUB_ENV"
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./app.deb
          echo "installed version:"; dpkg -s "$PKG" | grep -E '^Version:'
          dpkg -s "$PKG" | grep -E '^Version:' | grep -q '1.1.1' || { echo "FAIL: installed version is not 1.1.1"; exit 1; }

      - name: The app binary and its sidecars landed
        run: |
          set -eux
          BIN=$(dpkg -L "$PKG" | grep -E '/brisvia-miner$' | head -1); echo "BIN=$BIN" >> "$GITHUB_ENV"
          test -x "$BIN" || { echo "FAIL: app binary not executable at $BIN"; exit 1; }
          DIR=$(dirname "$BIN")
          echo "install dir:"; ls -la "$DIR"
          for s in bitcoind bitcoin-cli brisvia-worker; do
            F=$(dpkg -L "$PKG" | grep -E "/$s$" | head -1)
            test -n "$F" && test -f "$F" && echo "OK sidecar $s -> $F" || { echo "FAIL: sidecar $s missing from the package"; exit 1; }
          done
          echo "desktop entry:"; dpkg -L "$PKG" | grep -E '\.desktop$' || echo "(no .desktop listed)"

      - name: Open it once under Xvfb; it must NOT die immediately and must use a PERMANENT datadir
        run: |
          set -x
          export HOME=/root WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
          timeout 30 xvfb-run -a "$BIN" > app.out 2> app.err &
          PID=$!
          sleep 22
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: the app is still alive after 22s (did not crash on open)"
          else
            echo "FAIL: the app exited early"; echo "--- stderr ---"; tail -60 app.err; echo "--- stdout ---"; tail -20 app.out; exit 1
          fi
          # Permanent datadir (HOME/.brisvia), NOT the OS temp dir.
          if [ -d "$HOME/.brisvia" ]; then echo "OK: permanent datadir at $HOME/.brisvia"; ls -la "$HOME/.brisvia" || true; else
            echo "NOTE: $HOME/.brisvia not created yet (the app may still be starting the node)"; fi
          # Close cleanly.
          kill "$PID" 2>/dev/null || true; sleep 2; pkill -f bitcoind 2>/dev/null || true
          echo "--- last stderr ---"; tail -30 app.err || true

      - name: Keep the .deb smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb-smoke-logs
          path: |
            app.out
            app.err
